<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Avaliar Juliana Medina no Google</title>

  <meta
    name="description"
    content="Avalie sua experiência com Juliana Medina Psicopedagogia e Neuropsicopedagogia no Google."
  />

  <!-- Redirecionamento automático via meta tag -->
  <meta
    http-equiv="refresh"

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #F8EEF2;
      color: #3A2E33;
      text-align: center;
      padding: 24px;
    }

    .card {
      max-width: 420px;
      background: #FFFFFF;
      border-radius: 24px;
      padding: 32px 28px;
      box-shadow: 0 18px 45px rgba(58, 46, 51, 0.12);
      border: 1px solid rgba(233, 183, 199, 0.45);
    }

    .stars {
      color: #D98FA6;
      letter-spacing: 0.12em;
      font-size: 1.2rem;
      margin-bottom: 14px;
    }

    h1 {
      font-size: 1.35rem;
      margin: 0 0 12px;
      line-height: 1.25;
    }

    p {
      margin: 0 0 20px;
      color: #555555;
      line-height: 1.6;
      font-size: 0.96rem;
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 13px 22px;
      border-radius: 999px;
      background: linear-gradient(135deg, #E9B7C7, #D98FA6);
      color: #3A2E33;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      transition: transform 0.2s ease;
    }

    a:hover {
      transform: translateY(-2px);
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="stars" aria-hidden="true">★★★★★</div>

    <h1>Redirecionando para o Google</h1>

    <p>
      Você será direcionado para avaliar sua experiência com Juliana Medina no Google.
    </p>

    <!-- Tag <a> aberta corretamente com o link dentro do href -->

  <script>
    window.location.replace(
      "https://www.google.com/maps/place/Juliana+Medina+Psicopedagogia+e+Neuropsicopedagogia/@-22.7792878,-43.2926873,1003m/data=!3m1!1e3!4m8!3m7!1s0xab3b0947fe6f0d23:0x913c99a00ea89a8c!8m2!3d-22.7792878!4d-43.2926873!9m1!1b1!16s%2Fg%2F11tghqsghl?entry=ttu"
